# n8n for the payslip email agent. Runs rootless under Podman via docker-compose:
#   export DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock
#   docker-compose up -d
services:
  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Amsterdam
      GENERIC_TIMEZONE: Europe/Amsterdam
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      # Encrypts the credential store. Losing it means re-entering every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Execution data contains payslip text; keep it a week, then prune.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow files, for: podman exec n8n n8n import:workflow --separate --input=/workflows
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
